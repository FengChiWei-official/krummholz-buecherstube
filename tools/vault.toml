# vaultkit config — the single home for zones, genres, thresholds, paths and baselines.
# Every literal the tools used to hardcode lives here (v6, plan P2).

[zones]
raw = "Raw"
index = "Index"
links = "Links"
node_suffix = "_fold"
# Fold for a name that starts with a digit / with a CJK character (v6 convention).
digit_fold = "0_fold"
cjk_fold = "中_fold"

[genres]
raw_prefix = "Raw Index"
index_prefix = "Index of"
index_suffix = "-MOC"
links_prefix = "Links "

[thresholds]
todo_stale_days = 90
halfdone_window_days = 7
cluster_theta_percentile = 0.97
l0_confidence = 0.9
rawindex_top = 10
# `links-candidates` evidence grades: how strong a reason each kind of evidence is
# for putting a note on a Links card. Higher = stronger. A bare shared Index area
# is deliberately NOT graded here: it is not evidence at all (a large area would
# otherwise contribute nearly every note), so it stays out of the config.
links_name = 3
links_alias = 3
links_structural = 2
links_text = 2
links_neighbour = 1

[paths]
library = "library"
archives_material = "archives/material"
archives_work = "archives/work"
todos = "a_sticker/todos"
zzz = "zzz_output"
doctrine = "doctrine"
template = "template"

# Scaffolds are OPTIONAL (D30): the tools never require one. This map only says
# which scaffold `vault.py new` picks for a genre — key = genre/zone, value = file
# under `paths.template`. Missing key (work, root) = plain markdown.
[templates]
node = "node-temp.md"
raw = "raw-index-temp.md"
index = "index-temp.md"
links = "links-temp.md"
material = "lit-temp.md"
todos = "todo-temp.md"

[scan]
# Scan scope. `tests/` holds a complete fixture vault and `.pytest_cache/` a
# generated README — both would enter the graph as notes (duplicate stems, counts
# that change depending on whether the suite ran). D38.
skip_dirs = [".git", ".obsidian", ".agent", ".pytest_cache", "tests"]
notes_extra_skip_dirs = ["zzz_output", "template"]
root_allowed = ["README.md", "AGENTS.md"]

[trunk]
root_stem = "Raw Index of Everything"
# "tree": a Node belongs to exactly one Raw Index (multi-parent = violation).
# "dag":  registration is an edge — a Node needs >=1 edge, may have several;
#         uniqueness lives in the (Raw Index, Node) pair; Raw Index -> Raw Index
#         must stay acyclic (I1c).
model = "dag"

[files]
whitelist_unresolved = "tools/whitelist_unresolved.txt"

# ── docs sync map ────────────────────────────────────────────────────────────
# Machine copy of doctrine/Vault Extension.md §同步面. The handbook owns the
# prose (what each row means and why); this table owns what is checkable.
# Ids must match the handbook table 1:1 — tests/test_docs.py asserts that.
#
# Probes (a row fires when any one of its probes fires):
#   paths             any of these paths changed
#   paths_added       a NEW file matches one of these globs
#   ids_file          the set of rule ids in this file changed (rules.py)
#   subcommands_file  the set of subcommand names in this file changed (cli.py)
#   help_topics_file  the set of `help <topic>` names in this file changed (cli.py)
#   env_files         the set of environment variables read by these files changed
# A row with no probe is manual: the handbook names its trigger, no path can see
# it. `sync` entries ending in "/" mean "any file under this directory".

[[docs_sync.rules]]
id = "T1"
note = "无需改文档"
paths = ["tools/vault.toml"]
sync = []

[[docs_sync.rules]]
id = "T2"
note = "判据增删改名（id 集合变化即触发）"
ids_file = "tools/vaultkit/rules.py"
sync = ["README.md", "AGENTS.md", "doctrine/Agent Contract.md",
        "doctrine/Vault Design.md", "tools/vaultkit/cli.py",
        "a_sticker/or/记忆底座-首批卡片.md", "tests/"]

[[docs_sync.rules]]
id = "T3"
note = "manual — 硬门增删：owner 裁决 + 新 D 号，机器无法判定"
sync = ["README.md", "AGENTS.md", "doctrine/Agent Contract.md",
        "doctrine/Vault Design.md", "tools/vaultkit/cli.py",
        "a_sticker/or/记忆底座-首批卡片.md", "tests/",
        ".github/workflows/ci.yml"]

[[docs_sync.rules]]
id = "T4"
note = "登记语义 / 主干模型"
paths = ["tools/vaultkit/model.py"]
sync = ["doctrine/Vault Design.md", "README.md", "AGENTS.md",
        "tools/vaultkit/cli.py"]

[[docs_sync.rules]]
id = "T5"
note = "子命令 / help 主题增删（集合变化即触发）"
subcommands_file = "tools/vaultkit/cli.py"
help_topics_file = "tools/vaultkit/cli.py"
sync = ["README.md", "doctrine/Agent Contract.md", ".agent/skills/vault-ops/SKILL.md",
        "tests/"]

[[docs_sync.rules]]
id = "T6"
note = "manual — 体裁 / 分区规则"
sync = ["AGENTS.md", "doctrine/Vault Design.md", "README.md",
        "a_sticker/or/记忆底座-首批卡片.md"]

[[docs_sync.rules]]
id = "T7"
note = "manual — 字段政策"
sync = ["AGENTS.md", "doctrine/Vault Design.md", "README.md",
        "a_sticker/or/记忆底座-首批卡片.md"]

[[docs_sync.rules]]
id = "T8"
note = "manual — 模板政策"
sync = ["AGENTS.md", "doctrine/Vault Design.md", "README.md"]

[[docs_sync.rules]]
id = "T9"
note = "manual — doctrine 语义变化"
sync = ["doctrine/Vault Design.md", "a_sticker/or/记忆底座-首批卡片.md"]

[[docs_sync.rules]]
id = "T10"
note = "环境变量集合（探针）+ 本机 / Obsidian / 插件设置（manual，.obsidian 不在 git）"
env_files = ["tools/vaultkit/config.py", "tools/trend_radar.py"]
sync = ["doctrine/New Machine.md"]

[[docs_sync.rules]]
id = "T11"
note = "新增 doctrine 文件"
paths_added = ["doctrine/*.md"]
sync = ["AGENTS.md", "README.md", "doctrine/Vault Design.md",
        ".agent/skills/vault-ops/SKILL.md"]

[[docs_sync.rules]]
id = "T12"
note = "新增工具入口（tools/ 的直接子文件）"
paths_added = ["tools/*.py"]
sync = ["README.md", "doctrine/Agent Contract.md", ".agent/skills/vault-ops/SKILL.md",
        "tests/"]


