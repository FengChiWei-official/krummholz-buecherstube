# vaultkit config — the single home for zones, genres, thresholds, paths and baselines.
# Every literal the tools used to hardcode lives here (v6, plan P2).

[zones]
raw = "Raw"
index = "Index"
links = "Links"
node_suffix = "_fold"

[genres]
raw_prefix = "Raw Index"
index_prefix = "Index of"
index_suffix = "-MOC"
links_prefix = "Links "

[thresholds]
todo_stale_days = 90
halfdone_window_days = 7
cluster_theta_percentile = 0.97
l0_confidence = 0.9
rawindex_top = 10

[paths]
library = "library"
archives_material = "archives/material"
archives_work = "archives/work"
todos = "a_sticker/todos"
zzz = "zzz_output"
doctrine = "doctrine"

[scan]
skip_dirs = [".git", ".obsidian", ".agent"]
notes_extra_skip_dirs = ["zzz_output", "template"]
root_allowed = ["README.md", "AGENTS.md"]

[trunk]
root_stem = "Raw Index of Everything"
# "tree": a Node belongs to exactly one Raw Index (multi-parent = violation).
# "dag":  registration is an edge — a Node needs >=1 edge, may have several;
#         uniqueness lives in the (Raw Index, Node) pair; Raw Index -> Raw Index
#         must stay acyclic (I1c).
model = "dag"

[files]
whitelist_unresolved = "tools/whitelist_unresolved.txt"


